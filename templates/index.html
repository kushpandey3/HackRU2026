<!doctype html>
<html lang="en">


<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>HACKRU Paper Trading Venue</title>
 <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
 <link href = "https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel = "stylesheet">
 <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>


<body style = "background-color: #FAF3DD;">


 <h1 class = "title"> Paper Trading Venue </h1>


 <div style = "display: flex">


   <div class = "account-box">


     <div class="account-heading">
       <h2>Total Account Value</h2>
       <p class="account-caption" id="account-caption">Cash plus the current value of your stocks</p>
     </div>


     <div class="account-total">
       <h1 class="money-display" id="account-equity">—</h1>
     </div>

     <div class="portfolio-summary">
       <div><span>Cash available to trade</span><strong id="account-cash">—</strong></div>
       <div><span>30-day change</span><strong class="account-change" id="account-change">Loading…</strong></div>
     </div>


     <div class="money-chart-area">
       <canvas id="stats-chart"></canvas>
     </div>


   </div>


   <div class="trade-area">
     <h2>Place a trade</h2>


     <form class="trade-form" id="trade-form">
       <label class="trade-label" for="trade-symbol">STOCK</label>
       <div class="symbol-entry">
         <div class="trade-input-shell ticker-shell">
           <span class="ticker-prefix">$</span>
           <input id="trade-symbol" name="symbol" type="text" placeholder="Search a company or ticker" maxlength="40" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="symbol-suggestions" required>
         </div>
         <div class="symbol-suggestions" id="symbol-suggestions" role="listbox" hidden></div>
       </div>
       <p class="demo-quote" id="demo-quote">Enter a ticker to load its market quote.</p>


       <div class="trade-label trade-type-label">ORDER TYPE</div>
       <div class="trade-type" role="group" aria-label="Order type">
         <button class="trade-type-button active" type="button" data-side="buy" aria-pressed="true">Buy</button>
         <button class="trade-type-button" type="button" data-side="sell" aria-pressed="false">Sell</button>
       </div>


       <div class="trade-fields">
         <div>
           <label class="trade-label" for="trade-quantity">SHARES</label>
         <input class="trade-input" id="trade-quantity" name="quantity" type="number" min="0.0001" step="any" placeholder="0" required>
         </div>
         <div>
           <label class="trade-label" for="trade-date">TRADE DATE</label>
           <input class="trade-input trade-date" id="trade-date" name="date" type="date">
         </div>
       </div>


       <div class="trade-estimate">
         <span>ESTIMATED ORDER</span>
         <strong id="trade-estimate">Look up a stock and enter shares</strong>
       </div>
       <button class="trade-submit" id="trade-submit" type="submit" disabled>Place buy order <span>↗</span></button>
       <p class="trade-note" id="trade-note" role="status" aria-live="polite"></p>
     </form>
   </div>


 </div>


 <section class="trade-history" aria-labelledby="trade-history-title">
   <div class="trade-history-heading">
     <h2 id="trade-history-title">Recent trades</h2>
     <span class="trade-history-count" id="trade-history-count">0 TRADES</span>
   </div>
   <div class="trade-history-list" id="trade-history-list">
     <p class="trade-history-empty">Loading trades…</p>
   </div>
 </section>


 <script src = "{{ url_for('static', filename='app.js') }}"></script>


</body>


</html>
